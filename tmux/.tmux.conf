set-option -g prefix C-b
set-option -g prefix2 C-a


set-option -g history-limit 100000
# SSH_CONNECTION is in the default list; sshd sets these too
set-option -ga update-environment "SSH_CLIENT SSH_TTY"
set -g default-terminal "${TERM}"
set-window-option -g mode-keys vi

# Automatic rename
set-option -g status-interval 2
set-option -g allow-rename on
set-option -g automatic-rename on
set-option -g renumber-windows on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set -g base-index 1

bind -n C-x setw synchronize-panes
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind -T copy-mode-vi C-j send-keys -X cursor-down \; send-keys -X cursor-down \; send-keys -X cursor-down \; send-keys -X cursor-down \; send-keys -X cursor-down
bind -T copy-mode-vi C-k send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X cursor-up

bind-key v copy-mode
bind-key C-u copy-mode
bind-key -n C-\\ copy-mode
bind-key -n Pageup copy-mode
bind-key -n Pagedown copy-mode
bind a run tmux-url-select


bind-key J choose-window "join-pane -h -t '%%'" # Current pane to selected window
bind-key b break-pane # Current pane to new window
bind-key B display-popup -E -w 60% -h 50% -T " move window to session " "~/.tmux/window-to-session.sh" # Current window to another/new session

# Make new panes and windows open in same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-u attach-session -t . -c '#{pane_current_path}'

bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-i previous-window
bind -n M-o next-window

# extended-keys makes the terminal report alt+shift+<key> as CSI-u, which tmux
# names M-S-i rather than M-I, so bind every spelling.
bind -n M-I switch-client -p
bind -n M-S-i switch-client -p
bind -n M-S-I switch-client -p
bind -n M-O switch-client -n
bind -n M-S-o switch-client -n
bind -n M-S-O switch-client -n

bind -n M-z resize-pane -Z
bind -n M-x set-option status

set -g focus-events on
set -g status on
set -g status-interval 2

# GitHub Dark Default palette, matching the ghostty theme
set -g @c-bg     "#161b22"
set -g @c-deep   "#0d1117"
set -g @c-fg     "#e6edf3"
set -g @c-dim    "#6e7681"
set -g @c-line   "#30363d"
set -g @c-blue   "#58a6ff"
set -g @c-mag    "#bc8cff"
set -g @c-surf   "#30363d"
set -g @c-yellow "#d29922"
set -g @c-red    "#ff7b72"

# Rounded caps, drawn in the pill's colour against the bar background
set -g @pill-l ""
set -g @pill-r ""

set -g status-style "fg=#e6edf3,bg=#161b22"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 140

# Left pill shows the session name, or the active mode when there is one
set -g @mode-color "#{?pane_synchronized,#{@c-red},#{?client_prefix,#{@c-yellow},#{?pane_in_mode,#{@c-mag},#{@c-blue}}}}"
set -g @mode-text "#{?pane_synchronized,SYNC,#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#{session_name}}}}"
set -g status-left "#[fg=#{E:@mode-color},bg=#{@c-bg}]#{@pill-l}#[fg=#{@c-deep},bg=#{E:@mode-color},bold]#{E:@mode-text}#[fg=#{E:@mode-color},bg=#{@c-bg},nobold]#{@pill-r} "

# Glyph for whatever runs in the window's active pane
set -g @win-icon "#{?#{m:*vim,#{pane_current_command}}, ,#{?#{m:hx,#{pane_current_command}}, ,#{?#{m:*git*,#{pane_current_command}}, ,#{?#{m:jj,#{pane_current_command}}, ,#{?#{m:node,#{pane_current_command}}, ,#{?#{m:*python*,#{pane_current_command}}, ,#{?#{m:*docker*,#{pane_current_command}}, ,#{?#{m:k9s,#{pane_current_command}},☸ ,#{?#{m:kubectl,#{pane_current_command}},☸ ,#{?#{m:ssh,#{pane_current_command}}, ,#{?#{m:claude,#{pane_current_command}},✻ ,#{?#{m:fish,#{pane_current_command}}, ,#{?#{m:zsh,#{pane_current_command}}, ,#{?#{m:bash,#{pane_current_command}}, ,#{?#{m:sh,#{pane_current_command}}, ,}}}}}}}}}}}}}}}"
set -g @win-flags "#{?window_zoomed_flag,#[fg=#{@c-yellow}] ,}#{?window_bell_flag,#[fg=#{@c-yellow}] ,}#{?window_activity_flag,#[fg=#{@c-dim}] •,}"

setw -g window-status-current-format "#[fg=#{@c-surf},bg=#{@c-bg}]#{@pill-l}#[fg=#{@c-fg},bg=#{@c-surf},bold]#{window_index} #{E:@win-icon}#{window_name}#{E:@win-flags}#[fg=#{@c-surf},bg=#{@c-bg},nobold]#{@pill-r}"
setw -g window-status-format " #[fg=#{@c-dim},bg=#{@c-bg},nobold]#{window_index} #{E:@win-icon}#{window_name}#{E:@win-flags}#[fg=#{@c-dim},bg=#{@c-bg},nobold] "
setw -g window-status-separator ""
setw -g window-status-style "fg=#6e7681,bg=#161b22"
setw -g window-status-current-style "fg=#e6edf3,bg=#161b22"
setw -g window-status-last-style "fg=#6e7681,bg=#161b22"
setw -g window-status-activity-style "fg=#6e7681,bg=#161b22"
setw -g window-status-bell-style "fg=#ff7b72,bg=#161b22"
setw -g monitor-activity on
set -g visual-activity off

# Right: session switcher, then the clock
set -g @sess-current "#[fg=#{@c-mag},bg=#{@c-bg}]#{@pill-l}#[fg=#{@c-deep},bg=#{@c-mag},bold]#{session_name}#[fg=#{@c-mag},bg=#{@c-bg},nobold]#{@pill-r}"
set -g @sess-other "#{?session_attached,#[fg=#{@c-mag}],#[fg=#{@c-dim}]} #{session_name} #[default]"
set -g status-right "#{S:#{?#{==:#{session_name},#{client_session}},#{E:@sess-current},#{E:@sess-other}}} #[fg=#{@c-line}]│#[fg=#{@c-dim}] #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%a %d %b #[fg=#{@c-fg},bold]%H:%M #[default]"

set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"
set -g display-panes-colour "#6e7681"
set -g display-panes-active-colour "#58a6ff"

set -g message-style "fg=#0d1117,bg=#d29922,bold"
set -g message-command-style "fg=#0d1117,bg=#58a6ff,bold"
set -g mode-style "fg=#0d1117,bg=#bc8cff,bold"
set -g clock-mode-colour "#58a6ff"

set -g mouse on
set-option -g renumber-windows on

set -g window-style 'fg=#b1bac4,bg=#161b22'
set -g window-active-style 'fg=#e6edf3,bg=#0d1117'

# Popup window
bind 'P' display-popup -E "tmux -L popup new-session -A -s popup"

# allow passthrough of notifications and such from claude code
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'schasse/tmux-jump'

set -g @plugin 'fashton28/mux'

set -g @jump-key 'ø'
set -g @fingers-key f

bind o run -b "#{@fingers-cli} start #{pane_id} --patterns 1 --main-action 'xargs python /home/jonas/.tmux/idea-open-with-line.py #{pane_current_path} #{pane_id}'"
bind e run -b "#{@fingers-cli} start #{pane_id} --patterns path --main-action 'xargs tmux new-window nvim'"

bind-key E run-shell ~/.tmux/capture-and-edit.sh

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'



