"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
email = "jonas@natten.it"
name = "Jonas Natten"

[[--scope]]
--when.repositories = ["~/dev/ndla"]

[--scope.user]
email = "jonas.natten@knowit.no"

[signing]
behavior = "drop"
backend = "ssh"
key = "ssh-rsa "
backends.ssh.program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"

[git]
sign-on-push = true
colocate = true

[ui]
diff-formatter = ":git"
pager = ["delta", "--pager", "less -RF --redraw-on-quit"]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]
merge-editor = "idea"
conflict-marker-style = "git"
default-command = "st"

[merge-tools.diffview]
program = "bash"
diff-args = [
  "-c",
  'exec nvim -c "DiffviewDiffDirs $1 $2" -c "autocmd TabClosed * ++once qa" </dev/tty >/dev/tty',
  "jj diff --tool diffview",
  "$left",
  "$right",
]
merge-args = [
  "-c",
  'exec nvim "$@"',
  "jj resolve --tool diffview",
  "-c",
  "DiffviewMergeFiles $output $base $left $right",
]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"

[merge-tools.idea]
program = "idea"
diff-args = ["diff", "$left", "$right"]
edit-args = ["diff", "$left", "$right"]
merge-args = ["merge", "$left", "$right", "$base", "$output"]

[aliases]
ws-add = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  'exec "$HOME/.config/jj/workspace-add.sh" "$@"',
  "jj ws-add",
]
l = ["log", "-r", "log_this_workspace()"]
lb = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  'if [ $# -gt 0 ] && [ "${1#-}" = "$1" ]; then rev=$1; shift; else rev=@; fi; exec jj -R "$JJ_WORKSPACE_ROOT" log -r "log_branch($rev)" "$@"',
  "jj lb",
]
bc = ["bookmark", "create", "-r", "@-"]
difftastic-nvim = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  '[ "$1" = -r ] && shift; exec nvim -c "Difft ${1:-@}" -c "autocmd TabClosed * ++once qa"',
  "jj difftastic-nvim",
]

[revsets]
bookmark-advance-to = "@-"

[revset-aliases]
'other_workspaces()' = '(working_copies() ~ @) & empty() & description(exact:"")'
'log_this_workspace()' = 'builtin_log() ~ other_workspaces()'
'branch(x)' = 'fork_point(x | trunk()) | (trunk()..x)::'
'log_branch(x)' = '(branch(x) | trunk()) ~ other_workspaces()'
'this_branch()' = 'branch(@)'
'log_this_branch()' = 'log_branch(@)'
